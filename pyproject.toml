[project]
name = "inference-lab"
version = "0.1.0"
description = "Local LLM inference gateway and benchmark harness (portfolio project 01)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
tokenizer = ["tokenizers>=0.19"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["gateway/tests", "benchmarks"]
addopts = "-q"

[tool.uv]
package = false
